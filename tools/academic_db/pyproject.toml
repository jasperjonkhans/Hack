[project]
name = "academic-db-mcp"
version = "0.1.0"
description = "MCP server that lets Omnigent agents read and write the academic works database"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "mcp>=1.20,<2",  # mcp 2 removed mcp.server.fastmcp, which server.py uses
    "psycopg[binary,pool]>=3.2",
]

[project.scripts]
academic-db-mcp = "academic_db.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/academic_db"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: needs ACADEMIC_DB_URL / ACADEMIC_DB_READER_URL (changes are rolled back)",
    "network: calls the OpenAlex, Semantic Scholar and arXiv APIs",
]
