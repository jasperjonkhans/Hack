[project]
name = "literature-tools"
version = "0.1.0"
description = "Literature search and full-text tools for the Scout and Verifier agents"
requires-python = ">=3.12"
dependencies = [
    "omnigent>=0.16.0",
    "pypdf>=6.19.0",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/literature_tools"]
