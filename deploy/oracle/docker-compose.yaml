# Team Omnigent server on the Oracle VM. Start it with ./deploy.sh, which
# writes OMNIGENT_IMAGE_TAG (the omnigent version locked in uv.lock) to .env.
name: omnigent

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: omnigent
      POSTGRES_USER: omnigent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnigent -d omnigent"]
      interval: 10s
      timeout: 5s
      retries: 5

  omnigent:
    image: ghcr.io/omnigent-ai/omnigent-server:${OMNIGENT_IMAGE_TAG:?run ./deploy.sh, it writes OMNIGENT_IMAGE_TAG to .env}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://omnigent:${POSTGRES_PASSWORD}@postgres:5432/omnigent
      ARTIFACT_DIR: /data/artifacts
      HOST: 0.0.0.0
      PORT: "8000"
      OMNIGENT_ADMIN_CREDENTIALS_PATH: /data/admin-credentials
      OMNIGENT_AUTH_ENABLED: "1"
      OMNIGENT_DOMAIN: ${OMNIGENT_DOMAIN:?set OMNIGENT_DOMAIN in .env}
      OMNIGENT_ACCOUNTS_BASE_URL: https://${OMNIGENT_DOMAIN}
      OMNIGENT_ACCOUNTS_COOKIE_SECRET: ${OMNIGENT_ACCOUNTS_COOKIE_SECRET:?set OMNIGENT_ACCOUNTS_COOKIE_SECRET in .env}
      OMNIGENT_ACCOUNTS_AUTO_OPEN: "0"
      OMNIGENT_FEATURES: ${OMNIGENT_FEATURES:-}
      # The only agent in the picker: Mimir, the research team in lab/ (named after its mount).
      OMNIGENT_BUILTIN_AGENT_DIRS: /agents/Mimir
      # Picker lists only mounted agents; Omnigent's packaged agents aren't seeded.
      PYTHONPATH: /opt/omnigent-overrides
    volumes:
      - artifact-data:/data
      # Research Lead (lab/config.yaml) with its Scout and Verifier sub-agents.
      - ../../lab:/agents/Mimir:ro
      - ./omnigent-overrides:/opt/omnigent-overrides:ro
    ports:
      - "127.0.0.1:8000:8000"

  caddy:
    # Pinned: deploy.sh pulls on every run. 2.11.6's new body-read idle deadline
    # outlives the request and poisons keep-alive connections: after a proxied
    # call of 60 s or more, every later request on that connection fails at once
    # with 499 (caddyserver/caddy#8103, fixed in 2.11.7). Move to >= 2.11.7 once
    # Docker Hub publishes it.
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    depends_on:
      - omnigent
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      OMNIGENT_DOMAIN: ${OMNIGENT_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres-data:
  artifact-data:
  caddy-data:
  caddy-config:
