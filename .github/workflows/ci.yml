name: CI

on:
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run python -m unittest discover -s demo -v
      - name: Validate deploy config
        working-directory: deploy/oracle
        env:
          OMNIGENT_IMAGE_TAG: ci
          OMNIGENT_DOMAIN: ci.invalid
          POSTGRES_PASSWORD: ci
          OMNIGENT_ACCOUNTS_COOKIE_SECRET: ci
        run: docker compose config --quiet
