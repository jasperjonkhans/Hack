[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "omnigent-tools"
version = "0.1.0"
description = "Agent tools for Omnigent, including Lean 4 proof verification"
requires-python = ">=3.10"
dependencies = ["lean-interact==0.11.5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<0.17"]

[project.scripts]
omnigent-lean = "omnigent.tools.lean:main"

[tool.hatch.build.targets.wheel]
packages = ["src/omnigent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a provisioned Lean toolchain and REPL"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
